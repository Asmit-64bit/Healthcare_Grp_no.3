<!DOCTYPE html>
<html lang="en">
<head>
    <title>Patient Registration</title>
</head>
<body>
    <h2>Online Patient Registration Form</h2>
    <form action="#" method="POST">
        <fieldset>
            <legend>Patient Details</legend>
            <label for="pname">Patient Name:</label>
            <input type="text" id="pname" name="pname" placeholder="Enter Full Name" required autofocus><br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="120" required><br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label><br><br>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10-digit number" required><br><br>

            <label for="email">Email ID:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com"><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>
        </fieldset>

        <fieldset>
            <legend>Test Booking Details</legend>
            <label for="test">Test Selection:</label>
            <select id="test" name="test" required>
                <option value="">--Select Test--</option>
                <option value="cbc">CBC</option>
                <option value="urine">Routine Urine</option>
                <option value="lft">LFT</option>
            </select><br><br>

            <label for="appointment">Preferred Appointment Date:</label>
            <input type="date" id="appointment" name="appointment" required><br><br>

            <label for="sample">Sample Collection Preference:</label>
            <input type="radio" id="home" name="sample" value="Home" required> <label for="home">Home Collection</label>
            <input type="radio" id="lab" name="sample" value="Lab"> <label for="lab">Visit Lab</label><br><br>

            <label for="prescription">Upload Doctor Prescription:</label>
            <input type="file" id="prescription" name="prescription" accept=".pdf, .jpg, .png"><br><br>
        </fieldset>
        
        <br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
